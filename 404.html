<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      var pathSegmentsToKeep = 1;
      var locationInfo = window.location;
      var route = locationInfo.pathname
        .slice(1)
        .split('/')
        .slice(pathSegmentsToKeep)
        .join('/')
        .replace(/&/g, '~and~');
      var query = locationInfo.search
        ? '&' + locationInfo.search.slice(1).replace(/&/g, '~and~')
        : '';

      locationInfo.replace(
        locationInfo.protocol +
          '//' +
          locationInfo.hostname +
          (locationInfo.port ? ':' + locationInfo.port : '') +
          locationInfo.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          route +
          query +
          locationInfo.hash
      );
    </script>
  </head>
  <body></body>
</html>
